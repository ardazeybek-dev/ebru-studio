<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ebru Studio</title>
<meta name="description" content="Drop paint on water, pull it with a stylus or comb and make your own Turkish marbling (ebru). Runs in the browser, exports PNG.">
<meta name="theme-color" content="#141218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --chrome: rgba(24,21,28,.93);
  --chrome-line: rgba(255,244,224,.12);
  --ink: #f4ecdd;
  --muted: rgba(244,236,221,.62);
  --accent: #f0b730;
  --radius: 18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#141218;color:var(--ink);overflow:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
.grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,25,10,.22) 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand{pointer-events:auto;background:var(--chrome);
  border:1px solid var(--chrome-line);border-radius:var(--radius);padding:10px 16px 11px;line-height:1.05}
.brand h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;letter-spacing:.01em}
.brand h1 i{font-weight:400;color:var(--accent)}
.brand p{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.actions{pointer-events:auto;display:flex;gap:6px;background:var(--chrome);
  border:1px solid var(--chrome-line);border-radius:var(--radius);padding:6px}
.actions button{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border-radius:12px;font-size:13.5px;font-weight:500;transition:background .15s}
.actions button:hover{background:rgba(255,244,224,.09)}
.actions button.primary{background:var(--accent);color:#1c1406}
.actions button.primary:hover{background:#ffc94d}
.actions svg{width:18px;height:18px;flex:none}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));
  width:min(760px,calc(100vw - 32px));background:var(--chrome);
  border:1px solid var(--chrome-line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:8px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:14px;
  font-size:12px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.tools button svg{width:24px;height:24px}
.tools button:hover{color:var(--ink);background:rgba(255,244,224,.06)}
.tools button[aria-pressed=true]{background:rgba(255,244,224,.13);color:var(--ink)}
.tools button[aria-pressed=true] svg{color:var(--accent)}
.row{display:flex;align-items:center;gap:14px;padding:2px 8px 4px}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transition:transform .15s}
.swatches button:hover{transform:scale(1.1)}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px #141218,0 0 0 4px var(--ink);transform:scale(1.05)}
.size{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:12px;color:var(--muted);min-width:170px}
.size input{flex:1;accent-color:var(--accent);min-width:90px}
.size .dot{width:22px;height:22px;display:grid;place-items:center}
.size .dot span{display:block;border-radius:50%;background:var(--ink)}

.hint{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 136px);transform:translateX(-50%);padding:12px 18px;border-radius:999px;
  background:rgba(24,21,28,.93);font-size:14px;
  pointer-events:none;transition:opacity .6s;white-space:nowrap;border:1px solid var(--chrome-line)}
.hint.gone{opacity:0}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--accent);color:#1c1406;font-weight:600;
  font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:640px){
  .brand{padding:8px 12px 9px}
  .brand h1{font-size:21px}
  .brand p{display:none}
  .actions{gap:2px;padding:4px}
  .actions button{padding:0 10px;height:38px}
  .actions .lbl{display:none}
  .row{flex-wrap:wrap;gap:10px;padding:2px 4px 4px}
  .swatches{gap:6px;width:100%;justify-content:space-between}
  .swatches button{width:26px;height:26px}
  .size{margin-left:0;width:100%}
  .tools button{font-size:11px}
  .hint{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 178px);font-size:13px;white-space:normal;width:max-content;max-width:calc(100vw - 48px);text-align:center;border-radius:16px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Marbling tray. Tap to drop paint, drag to pull it."></canvas>
<div class="grain" id="grain"></div>
<div class="vignette"></div>

<header>
  <div class="brand">
    <h1>Ebru <i>Studio</i></h1>
    <p>the Turkish art of marbling on water</p>
  </div>
  <div class="actions">
    <button id="bUndo" title="Undo (Z)" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl">Undo</span></button>
    <button id="bClear" title="Clear the tray (C)" aria-label="Clear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg><span class="lbl">Clear</span></button>
    <button id="bAuto" title="Make a classic pattern (R)" aria-label="Make a pattern">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span class="lbl">Pattern</span></button>
    <button id="bSave" class="primary" title="Download PNG (S)" aria-label="Download PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg><span class="lbl">PNG</span></button>
  </div>
</header>

<div class="hint" id="hint">Tap to drop paint · hold to let it spread · drag with Comb or Stylus</div>
<div class="toast" id="toast"></div>

<nav class="dock" aria-label="Tools">
  <div class="tools" id="tools">
    <button data-tool="drop" aria-pressed="true" title="Damla — drop paint (1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg>Drop</button>
    <button data-tool="sprinkle" aria-pressed="false" title="Serpme — sprinkle drops (2)">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="8" r="2.3"/><circle cx="15.5" cy="6" r="1.6"/><circle cx="12" cy="13" r="2.8"/><circle cx="18" cy="15" r="2"/><circle cx="6.5" cy="17.5" r="1.7"/></svg>Sprinkle</button>
    <button data-tool="needle" aria-pressed="false" title="Biz — pull paint with a stylus (3)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M19 4 6.5 16.5"/><path d="M6.5 16.5 4 20l3.5-2.5"/><path d="M4 9c3-3 6 2 9-1"/></svg>Stylus</button>
    <button data-tool="comb" aria-pressed="false" title="Tarak — comb the paint (4)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18"/><path d="M5 6v12M9 6v12M13 6v12M17 6v12M21 6v12"/></svg>Comb</button>
    <button data-tool="swirl" aria-pressed="false" title="Girdap — hold to swirl (5)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 12a1.5 1.5 0 1 1 1.5-1.5c0 2.5-3.5 3.5-5 1.5-2-2.5 0-7 4-6.5 4.5.5 6 6 3 9-3.5 3.5-10 2-11-3"/></svg>Swirl</button>
  </div>
  <div class="row">
    <div class="swatches" id="swatches" aria-label="Paint colours"></div>
    <label class="size">Size
      <input id="size" type="range" min="12" max="90" value="38" aria-label="Brush size">
      <span class="dot"><span id="sizeDot"></span></span>
    </label>
  </div>
</nav>

<script>
(() => {
'use strict';
/* Ebru Studio — WebGL engine.
   The tray is a colour image (snap) plus a backward map M: what you see at x is snap(M(x)).
   Every tool is an exactly or iteratively invertible deformation, so a whole frame of tool
   motion is folded into M in one GPU pass, whatever the complexity of the pattern.
   The image is only resampled when new paint is dropped, which keeps the edges crisp. */
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
  document.getElementById('hint').textContent = 'This browser has no WebGL2 support, so the tray cannot run here.';
  return;
}
let W = 0, H = 0, DPR = 1;
const MARGIN = 220;                   // paint kept this far outside the view (combs pull it in)

const PALETTE = [
  ['Lapis', '#1f4597'], ['Indigo', '#1a2350'], ['Carmine', '#b3243b'], ['Rose', '#e3849a'],
  ['Saffron', '#f2b733'], ['Ochre', '#c8762a'], ['Turquoise', '#1d9c98'], ['Olive', '#617f37'],
  ['Ivory', '#f7f0e0'], ['Ink', '#17151a']
];
const C = Object.fromEntries(PALETTE.map(([n, h]) => [n, h]));
const THEMES = [
  { base: '#efe3c8', cols: ['Lapis', 'Carmine', 'Saffron', 'Ivory', 'Indigo'] },
  { base: '#e6eee8', cols: ['Turquoise', 'Lapis', 'Ivory', 'Indigo', 'Ochre'] },
  { base: '#f3e6d3', cols: ['Carmine', 'Rose', 'Olive', 'Saffron', 'Ivory'] },
  { base: '#1a1b2e', cols: ['Saffron', 'Ivory', 'Turquoise', 'Rose', 'Lapis'] },
  { base: '#ecdcbb', cols: ['Ochre', 'Olive', 'Carmine', 'Ink', 'Ivory'] },
  { base: '#f2ead8', cols: ['Indigo', 'Lapis', 'Turquoise', 'Ivory', 'Saffron'] }
];
const BASE = '#efe3c8';
let base = BASE;
let colorIdx = 0, tool = 'drop', size = 38;

function rgb(hex) { const v = parseInt(hex.slice(1), 16); return [(v >> 16) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255]; }
function shade(hex) {
  const k = 1 + (Math.random() - 0.5) * 0.14;
  return rgb(hex).map(x => Math.max(0, Math.min(1, x * k)));
}

/* ---------- GPU programs ---------- */
const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const COMMON = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform highp sampler2D uM;   uniform vec2 uMSize; uniform float uMS;
uniform sampler2D uSnap;       uniform vec2 uSnapSize; uniform float uSS;
uniform float uMargin;
uniform float uOS; uniform vec2 uOrigin; uniform float uFlipH;   // output: texels per css px, css origin, flip height (0 = none)
out vec4 o;
vec2 cssPos() {
  vec2 f = gl_FragCoord.xy;
  if (uFlipH > 0.0) f.y = uFlipH - f.y;
  return f / uOS + uOrigin;
}
vec2 sampleM(vec2 p) {
  vec2 lo = vec2(-uMargin), hi = (uMSize - 1.0) / uMS - uMargin;
  vec2 pc = clamp(p, lo, hi);
  vec2 t = (pc + uMargin) * uMS - 0.5;
  vec2 f = fract(t); ivec2 i = ivec2(floor(t)); ivec2 mx = ivec2(uMSize) - 1;
  ivec2 a = clamp(i, ivec2(0), mx), b = clamp(i + 1, ivec2(0), mx);
  vec2 v00 = texelFetch(uM, a, 0).xy, v10 = texelFetch(uM, ivec2(b.x, a.y), 0).xy;
  vec2 v01 = texelFetch(uM, ivec2(a.x, b.y), 0).xy, v11 = texelFetch(uM, b, 0).xy;
  return mix(mix(v00, v10, f.x), mix(v01, v11, f.x), f.y) + (p - pc);
}
vec3 snapAt(vec2 s) { return texture(uSnap, (s + uMargin) * uSS / uSnapSize).rgb; }
`;

const SIM_FS = COMMON + `
uniform sampler2D uOps; uniform int uN; uniform int uMode; uniform float uAA;
vec4 opA(int k) { return texelFetch(uOps, ivec2(2 * k, 0), 0); }
vec4 opB(int k) { return texelFetch(uOps, ivec2(2 * k + 1, 0), 0); }
float gelgit(float y, float s) {
  float lam = s * 0.2, i = floor(y / s + 0.5), v = 0.0;
  for (int d = -1; d <= 1; d++) { float k = i + float(d); v += (mod(abs(k), 2.0) > 0.5 ? -1.0 : 1.0) * exp(-abs(y - k * s) / lam); }
  return v;
}
float strokeW(vec2 p, vec2 a, vec2 u, float z, float sp, float lam) {
  float cut = lam * 9.0; vec2 r = p - a; float al = dot(r, u);
  float da = al > z ? al - z : (al < 0.0 ? -al : 0.0);
  if (da > cut) return 0.0;
  float pe = dot(r, vec2(-u.y, u.x));
  if (sp > 0.0) pe -= sp * floor(pe / sp + 0.5); else if (abs(pe) > cut) return 0.0;
  float dd = sqrt(da * da + pe * pe);
  return dd > cut ? 0.0 : z * exp(-dd / lam);
}
vec2 rot(vec2 c, vec2 d, float an) { float co = cos(an), si = sin(an); return c + vec2(d.x * co - d.y * si, d.x * si + d.y * co); }
void main() {
  vec2 p = cssPos();
  if (uMode == 2) { o = vec4(p, 0.0, 1.0); return; }
  vec2 y = p; bool hit = false; vec3 hc = vec3(0.0); float aw = 0.0; vec3 ac = vec3(0.0);
  for (int k = uN - 1; k >= 0; k--) {
    vec4 A = opA(k), B = opB(k); int t = int(A.x + 0.5);
    if (t == 1 || t == 2) {                       // new paint / a drop spreading
      vec2 c = A.yz; float r2 = A.w; vec2 d = y - c; float q = dot(d, d);
      if (q <= r2) { if (t == 1) { hit = true; hc = B.xyz; break; } y = c; continue; }
      if (t == 1 && aw == 0.0) { float e = sqrt(q) - sqrt(r2); if (e < uAA) { aw = 1.0 - e / uAA; ac = B.xyz; } }
      y = c + d * sqrt(1.0 - r2 / q);
    } else if (t == 3) {                          // stylus or comb step
      vec2 a = A.yz, m = vec2(A.w, B.x) - a; float z = length(m);
      if (z < 1e-3) continue;
      vec2 u = m / z;
      float w = strokeW(y, a, u, z, B.y, B.z);
      if (w == 0.0) continue;
      vec2 q = y - u * w;
      for (int it = 0; it < 3; it++) q = y - u * strokeW(q, a, u, z, B.y, B.z);
      y = q;
    } else if (t == 4) {                          // swirl
      vec2 c = A.yz, d = y - c; float R2 = B.x * B.x, q = dot(d, d);
      if (q <= 9.0 * R2) y = rot(c, d, -A.w * exp(-q / R2));
    } else if (t == 5) {                          // shear used by the classic patterns
      float z = A.y; int kind = int(A.z + 0.5); bool vert = A.w > 0.5; float s = B.x, lam = B.y;
      float v = vert ? y.x : y.y;
      float f = kind == 0 ? gelgit(v, s) : (kind == 1 ? exp(-abs(v - s * floor(v / s + 0.5)) / lam) : sin(v * 6.2831853 / s));
      if (vert) y.y -= z * f; else y.x -= z * f;
    } else if (t == 6) {                          // bulbul nests: many small swirls on a lattice
      float sp = A.y, an = A.z, Wl = A.w, Hl = B.x, R2 = sp * sp * 0.1156, cut = 6.0 * R2, e6 = exp(-6.0);
      float jc = floor((y.y - sp * 0.5) / sp + 0.5);
      for (int dj = 1; dj >= -1; dj--) {
        float j = jc + float(dj); float cy = sp * 0.5 + j * sp;
        if (j < 0.0 || cy >= Hl) continue;
        float off = sp * 0.5 + mod(j, 2.0) * sp * 0.5, ic = floor((y.x - off) / sp + 0.5);
        for (int di = 1; di >= -1; di--) {
          float i = ic + float(di); float cx = off + i * sp;
          if (i < 0.0 || cx >= Wl) continue;
          vec2 c = vec2(cx, cy), d = y - c; float q = dot(d, d);
          if (q > cut) continue;
          y = rot(c, d, -an * (exp(-q / R2) - e6) / (1.0 - e6));
        }
      }
    }
  }
  if (uMode == 0) { o = vec4(sampleM(y), 0.0, 1.0); return; }
  vec3 col = hit ? hc : snapAt(sampleM(y));
  if (!hit && aw > 0.0) col = mix(col, ac, aw);
  o = vec4(col, 1.0);
}`;

const SHOW_FS = COMMON + `
uniform float uRim; uniform float uPx;
vec3 at(vec2 p) { return snapAt(sampleM(p)); }
void main() {
  vec2 p = cssPos();
  vec3 c = at(p);
  if (uRim > 0.0) {
    vec3 a = at(p + vec2(uPx, 0.0)), b = at(p - vec2(uPx, 0.0)), d = at(p + vec2(0.0, uPx)), e = at(p - vec2(0.0, uPx));
    float g = max(max(length(a - c), length(b - c)), max(length(d - c), length(e - c)));
    c = mix(c, vec3(1.0, 0.973, 0.91), smoothstep(0.06, 0.28, g) * uRim);
  }
  o = vec4(c, 1.0);
}`;

function compile(fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const SIM = compile(SIM_FS), SHOW = compile(SHOW_FS);
gl.bindVertexArray(gl.createVertexArray());

function makeTex(w, h, fmt, filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}
function freeTex(x) { if (x) { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); } }

const MAXTEX = Math.min(4096, gl.getParameter(gl.MAX_TEXTURE_SIZE));
const OPS_PER_PASS = MAXTEX >> 1;
const opsTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, opsTex);
gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, MAXTEX, 1);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
const opsBuf = new Float32Array(MAXTEX * 4);

/* simulation state */
let SS = 1.5, MS = 0.75;     // texels per css px for the colour image and for the map
let snap = null, snap2 = null, M = null, M2 = null;

function bindSource(prog, snapT, mT) {
  const u = prog.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, mT.t); gl.uniform1i(u.uM, 0);
  gl.uniform2f(u.uMSize, mT.w, mT.h); gl.uniform1f(u.uMS, MS);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, snapT.t); gl.uniform1i(u.uSnap, 1);
  gl.uniform2f(u.uSnapSize, snapT.w, snapT.h); gl.uniform1f(u.uSS, SS);
  gl.uniform1f(u.uMargin, MARGIN);
}
function bindTarget(prog, target, scale) {
  const u = prog.u;

    a.href = URL.createObjectURL(b); a.download = 'ebru-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Saved as PNG');
  }, 'image/png');
}
document.getElementById('bUndo').onclick = undo;
document.getElementById('bClear').onclick = () => { snapshot(); cancelAll(); queue = []; base = BASE; fillBase(base); };
document.getElementById('bAuto').onclick = () => { hideHint(); randomPattern(); };
document.getElementById('bSave').onclick = save;
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== 'z') return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '5') setTool(['drop', 'sprinkle', 'needle', 'comb', 'swirl'][+k - 1]);
  else if (k === 'z') undo();
  else if (k === 's' && !e.ctrlKey && !e.metaKey) save();
  else if (k === 'r') { hideHint(); randomPattern(); }
  else if (k === 'c') document.getElementById('bClear').click();
});

// small hook for automated checks
window.__ebru = {
  play: name => playRecipe(name, THEMES[0]),
  work: () => { const a = perf.slice().sort((x, y) => x - y); return { avg: +(a.reduce((x, y) => x + y, 0) / a.length).toFixed(2), p95: +a[Math.floor(a.length * .95)].toFixed(2) }; },
  stats: () => ({ busy: tasks.length + grows.length + later.length, history: history.length, tex: [snap.w, snap.h, M.w, M.h] }),
};

resize();
// open on a freshly made classic pattern
tasks = RECIPES.tarakli(THEMES[0]);
lastRecipe = 'tarakli';
setTimeout(hideHint, 9000);
requestAnimationFrame(frame);
})();
</script>
